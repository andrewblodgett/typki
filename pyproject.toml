[project]
name = "typki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Blodgett", email = "andrewblodgett00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "typst>=0.15.0",
]

[project.scripts]
typki = "typki:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
untyped_calls_exclude = ["pytestqt"]

[[tool.mypy.overrides]]
module = ["typst", "pygments.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
